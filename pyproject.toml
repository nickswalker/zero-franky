[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-franky"
version = "0.1.3"
description = "ZeroMQ client/server bridge for franky"
readme = "README.md"
requires-python = ">=3.9,<3.15"
authors = [
	{ name = "Nick Walker" }
]

dependencies = [
    "pyzmq>=25.0.0",
    "msgpack>=1.0.0",
    "cloudpickle>=2.2.0"
]

[project.scripts]
zero-franky = "zero_franky.cli:main"

[project.optional-dependencies]

server = [
    "franky-control>=2.0.0"
    ]

robotiq = [
    "pyrobotiqgripper",
]

dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
    ]
