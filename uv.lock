    { name = "pytest", version = "9.0.3", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.10'" },
    { name = "pytest-cov" },
]
robotiq = [
    { name = "pyrobotiqgripper", version = "1.0.1", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.10'" },
    { name = "pyrobotiqgripper", version = "3.2.7", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.10'" },
]
server = [
    { name = "franky-control" },
]

[package.metadata]
requires-dist = [
    { name = "cloudpickle", specifier = ">=2.2.0" },
    { name = "franky-control", marker = "extra == 'server'", index = "https://nickswalker.github.io/franky/whl/libfranka-0.21.2/" },
